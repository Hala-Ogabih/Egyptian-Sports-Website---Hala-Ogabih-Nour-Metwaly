    <script>

        document.getElementById("findFlowSubtitle").innerHTML = "Made For Every Swimmer";
        document.getElementById("findFlowTitle").innerHTML = "FIND YOUR FLOW IN THE WATER";


        let findFlowCards = [
            {
                title: "01. LITTLE SPLASHERS",
                description: "Making Their First Water Memories! Fun, Gentle Sessions Where Little Ones Explore The Water Safely With You By Their Side."
            },
            {

                description: "Ready, Set, Splash! Kids Build Confidence, Learn The Basics, And Discover Just How Much Fun Swimming Can Be."
            },
            {
                title: "03. STROKE MASTERS",
                description: "Already Love Swimming? Sharpen Your Technique, Build Stamina, And Take Your Skills To The Next Level."
            },
            {
                title: "04. CHAMPIONS",
                description: "Got Your Eyes On The Finish Line? Train With Purpose, Improve Your Speed, And Get Ready To Make Waves In Competition."
            }
        ];

        document.getElementById("cardTitle1").innerHTML = findFlowCards[0].title;
        document.getElementById("cardDescription1").innerHTML = findFlowCards[0].description;
        document.getElementById("cardLink1").innerHTML = `EXPLORE CLASS <span class="FindFlow-arrow">↗</span>`;

        document.getElementById("cardTitle2").innerHTML = findFlowCards[1].title;
        document.getElementById("cardDescription2").innerHTML = findFlowCards[1].description;
        document.getElementById("cardLink2").innerHTML = `EXPLORE CLASS <span class="FindFlow-arrow">↗</span>`;

        document.getElementById("cardTitle3").innerHTML = findFlowCards[2].title;
        document.getElementById("cardDescription3").innerHTML = findFlowCards[2].description;
        document.getElementById("cardLink3").innerHTML = `EXPLORE CLASS <span class="FindFlow-arrow">↗</span>`;

        document.getElementById("cardTitle4").innerHTML = findFlowCards[3].title;
        document.getElementById("cardDescription4").innerHTML = findFlowCards[3].description;
        document.getElementById("cardLink4").innerHTML = `EXPLORE CLASS <span class="FindFlow-arrow">↗</span>`;


        document.getElementById("aboutLabel").innerHTML = "ABOUT US";

        document.getElementById("aboutTitle").innerHTML = `
        WHERE YOUR
        <span>SWIMMING</span>
        JOURNEY BEGINS`;

        document.getElementById("aboutDescription").innerHTML = `
        We believe swimming is more than a sport. It’s a
        feeling, a journey, and a connection between
        you and the water.

        From your very first stroke to your greatest
        achievements, we’re here to inspire confidence,
        celebrate progress, and help you discover the
        beauty of swimming.

        Every stroke tells a story. Let yours begin here.`;




        // start animation use AI
        const swimmingSection = document.querySelector(".SWIMMING-about-section");

        if (swimmingSection) {
            const swimmingObserver = new IntersectionObserver(
                (entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add("SWIMMING-visible");
                            swimmingObserver.unobserve(entry.target);
                        }
                    });
                },
                {
                    threshold: 0.2
                }
            );

            swimmingObserver.observe(swimmingSection);
        }



        // nour

        let wavesSection = document.querySelector(".waves-section");

        if (wavesSection && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            let wavesTicking = false;

            function updateWavesParallax() {
                let rect = wavesSection.getBoundingClientRect();
                let windowHeight = window.innerHeight;

                if (rect.bottom > 0 && rect.top < windowHeight) {
                    let progress = (windowHeight - rect.top) / (windowHeight + rect.height);
                    let movement = (progress - 0.5) * 110;

                    wavesSection.style.setProperty("--waves-parallax", movement + "px");
                }

                wavesTicking = false;
            }

            function handleWavesScroll() {
                if (!wavesTicking) {
                    requestAnimationFrame(updateWavesParallax);
                    wavesTicking = true;
                }
            }

            window.addEventListener("scroll", handleWavesScroll, { passive: true });
            window.addEventListener("resize", handleWavesScroll);

            updateWavesParallax();
        }



        document.getElementById("confidenceLabel").innerHTML = "WHY PUREWAVE?";

`;

`;

        document.getElementById("confidenceFeature2").innerHTML = "PROGRESS AT YOUR PACE";
        document.getElementById("confidenceFeature3").innerHTML = "PASSION IN EVERY LESSON";

        document.getElementById("confidenceLink").innerHTML = `
    DISCOVER OUR APPROACH <span>↗</span>
`;


        document.getElementById("milestonesLabel").innerHTML = "FROM OUR SWIMMING FAMILY";

        document.getElementById("milestonesTitle").innerHTML = `
    SMALL SPLASHES.<br>
    BIG MEMORIES.
`;

        document.getElementById("milestoneTitle1").innerHTML = "FIRST SPLASHES";
        document.getElementById("milestoneTitle2").innerHTML = "GROWING CONFIDENCE";
        document.getElementById("milestoneTitle3").innerHTML = "BIG MILESTONES";


        document.getElementById("wavesLabel").innerHTML = "THE WATER IS WAITING";

        document.getElementById("wavesTitle").innerHTML = `
    READY TO MAKE<br>
    WAVES?
`;

        document.getElementById("wavesDescription").innerHTML = `

    Find your flow, reach new milestones, and make every splash
    unforgettable.
`;

        document.getElementById("wavesButton").innerHTML = `

`;

`;

        document.getElementById("footerStory").innerHTML = "OUR STORY";
        document.getElementById("footerClasses").innerHTML = "OUR CLASSES";
        document.getElementById("footerContact").innerHTML = "CONTACT US";

        document.getElementById("footerProgramsTitle").innerHTML = "OUR PROGRAMS";

        document.getElementById("footerProgram1").innerHTML = "LITTLE SPLASHERS";
        document.getElementById("footerProgram2").innerHTML = "SWIM STARTERS";
        document.getElementById("footerProgram3").innerHTML = "STROKE MASTERS";
        document.getElementById("footerProgram4").innerHTML = "CHAMPIONS";

    © 2026 PUREWAVE. ALL RIGHTS RESERVED.
`;






      
const poolImageSection = document.querySelector(".footer-pool-image");
const poolImage = document.querySelector(".footer-pool-image img");

if (poolImageSection && poolImage) {
    function updatePoolParallax() {
        const rect = poolImageSection.getBoundingClientRect();

        const movement =
            (window.innerHeight / 2 - (rect.top + rect.height / 2)) * -0.18;

        poolImage.style.setProperty(
            "--pool-parallax",
            `${movement}px`
        );
    }

    window.addEventListener("scroll", updatePoolParallax, {
        passive: true
    });

    window.addEventListener("resize", updatePoolParallax);

    updatePoolParallax();
}
