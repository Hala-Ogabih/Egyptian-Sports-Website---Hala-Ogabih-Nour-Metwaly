<!DOCTYPE html>

<head>

    <header class="aquora-navbar">

        <a href="index.html" class="aquora-logo">

        <nav class="aquora-navigation">
            <a href="index.html" class="aquora-nav-link" id="navHome"></a>

            <a href="contact.html" class="aquora-nav-link" id="navContact"></a>
        </nav>

    <section class="move-hero">

            </div>

            <div class="move-swimmer-wrapper">

            </div>

            <div class="move-description-container">

                <h2 class="move-description-title" id="moveDescriptionTitle"></h2>

                <p
                    class="move-description-text"
                    id="moveDescriptionText">

            </div>

            <div class="move-social-bar">

                <a href="#" class="move-social-link">
                    <img src="img/facebook.png" alt="Facebook">
                </a>

                <a href="#" class="move-social-link">
                    <img src="img/instagram.png" alt="Instagram">
                </a>

                <a href="#" class="move-social-link">
                    <img src="img/x.png" alt="X">
                </a>

                <a href="#" class="move-social-link">
                    <img src="img/youtube.png" alt="YouTube">
                </a>

            </div>

            <div class="move-stats-container">

                <div class="move-stat-card">
                    <span class="move-stat-number" id="moveStatNumber1"></span>
                    <span class="move-stat-text" id="moveStatText1"></span>
                </div>

                <div class="move-stat-card">
                    <span class="move-stat-number" id="moveStatNumber2"></span>
                    <span class="move-stat-text" id="moveStatText2"></span>
                </div>

                <div class="move-stat-card">
                    <span class="move-stat-number" id="moveStatNumber3"></span>
                    <span class="move-stat-text" id="moveStatText3"></span>
                </div>

            </div>

        </div>

    </section>

                <h2 class="difference-title" id="differenceTitle"></h2>
            </div>

            <div class="difference-intro">
                <p id="differenceDescription"></p>
            </div>

        </div>

        <div class="difference-cards">

            <article class="difference-card">
                <img src="img/diff1.jpg" alt="Swimmer exploring freedom underwater" class="difference-card-image">

                <div class="difference-card-overlay"></div>

                <div class="difference-card-content">
                    <h3 id="differenceCard1"></h3>
                </div>
            </article>

            <article class="difference-card">
                <img src="img/diff2.jpg" alt="Swimmer floating in clear blue water" class="difference-card-image">

                <div class="difference-card-overlay"></div>

                <div class="difference-card-content">
                    <h3 id="differenceCard2"></h3>
                </div>
            </article>

            <article class="difference-card">
                <img src="img/diff3.jpg" alt="Swimmer moving powerfully through the water" class="difference-card-image">

                <div class="difference-card-overlay"></div>

                <div class="difference-card-content">
                    <h3 id="differenceCard3"></h3>
                </div>
            </article>

        </div>

            <span class="difference-philosophy-label" id="philosophyLabel"></span>
